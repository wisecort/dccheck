# Alembic configuration file for DCCheck.
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts, relative to this file.
script_location = alembic

# Template used when creating a new migration file.
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# Defaults to the current working directory.
prepend_sys_path = .

# Truncate revision identifiers at this length.
# truncate_slug_length = 40

# Version path separator (used on Windows with multiple version directories).
# version_path_separator = os  # Use os.pathsep.

# The output encoding used when revision files are written from script.py.mako.
# output_encoding = utf-8

# Database URL used for *offline* mode only.
# In *online* mode env.py reads the URL from the environment / config.
# Replace this placeholder with your actual URL when running Alembic locally.
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@localhost:5432/dccheck

# -------------------------------------------------
# Logging configuration
# -------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

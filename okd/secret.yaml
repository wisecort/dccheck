apiVersion: v1
kind: Secret
metadata:
  name: dccheck-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://dccheck:CHANGE_ME@db-host:5432/dccheck"
  SECRET_KEY: "CHANGE_ME_to_at_least_32_random_characters"
  SMTP_PASSWORD: "CHANGE_ME_smtp_password"
  SMTP_USER: "checklist@empresa.local"
  SMTP_FROM: "checklist@empresa.local"
  GESTOR_EMAIL: "gestor@empresa.local"
